<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0d16">
<meta name="description" content="数字炸弹 · 多人联机网页游戏，基于 WebRTC 设备直连，无需服务器存游戏数据。">
<title>数字炸弹 · 多人联机</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='30' cy='38' r='22' fill='%23141a2b'/%3E%3Crect x='26' y='6' width='9' height='11' rx='3' fill='%23838ea1'/%3E%3Cpath d='M35 8q11-6 17 5' stroke='%23ff8a3d' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  height:100%;margin:0;overflow:hidden;
  background:#0a0d16;
  background-image:radial-gradient(900px 480px at 50% -10%,rgba(255,95,60,.20),transparent 62%),radial-gradient(760px 460px at 105% 105%,rgba(95,115,255,.16),transparent 60%);
  color:#e9edf7;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;
}
input,button,select{font-family:inherit;font-size:16px}
.hidden{display:none !important}
.muted{color:#8b95b2;font-size:14px;margin:6px 0}
.hint{color:#7b86a5;font-size:12.5px;line-height:1.6;margin:10px 0 0}
h1,h2,h3{margin:0}
h2{font-size:16px;margin-bottom:10px}

/* ---------- 通用组件 ---------- */
.card{
  background:linear-gradient(180deg,rgba(26,32,54,.95),rgba(20,25,43,.95));
  border:1px solid #232b47;border-radius:16px;padding:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.btn{
  border:0;border-radius:12px;height:48px;padding:0 18px;
  background:#242c49;color:#e9edf7;font-weight:600;cursor:pointer;
  transition:transform .12s ease,filter .12s ease,opacity .12s ease;
  display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#ff8a3d,#ff3d6e);color:#fff;box-shadow:0 8px 20px rgba(255,80,90,.28)}
.btn.block{width:100%;margin-top:14px}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1 1 0;padding:0 10px}
input[type=text],input[type=number],input:not([type]){
  width:100%;height:48px;border-radius:12px;border:1px solid #28304d;
  background:#0f1424;color:#e9edf7;padding:0 14px;outline:none;
  transition:border-color .15s ease;
}
input:focus{border-color:#ff6b3d}
input:disabled{opacity:.5}
label.field{display:block;margin-bottom:14px}
label.field>span{display:block;font-size:13px;color:#8b95b2;margin-bottom:6px}
.mini{
  border:1px solid #2c3556;background:#1b2238;color:#c8d1e6;
  border-radius:9px;height:30px;padding:0 10px;font-size:12.5px;cursor:pointer;
}
.mini.ghost{background:transparent}
.pill{
  border:1px solid #2c3556;background:#161c30;color:#c8d1e6;border-radius:999px;
  height:38px;padding:0 14px;font-size:14px;cursor:pointer;
}
.pill.on{background:linear-gradient(135deg,#ff8a3d,#ff3d6e);border-color:transparent;color:#fff;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.seg{display:flex;background:#0f1424;border:1px solid #28304d;border-radius:12px;padding:4px;margin-bottom:14px}
.seg-btn{
  flex:1 1 0;border:0;background:transparent;color:#8b95b2;height:38px;
  border-radius:9px;cursor:pointer;font-size:14.5px;
}
.seg-btn.on{background:#242c49;color:#fff;font-weight:600}

/* ---------- 首页 ---------- */
.screen{display:none;height:100%}
.screen.active{display:flex;flex-direction:column}
#screen-home{overflow-y:auto}
.home-wrap{margin:auto;width:100%;max-width:440px;padding:28px 18px calc(28px + env(safe-area-inset-bottom))}
.brand{text-align:center;margin-bottom:22px}
.logo{font-size:52px;line-height:1;filter:drop-shadow(0 6px 18px rgba(255,90,60,.5))}
.brand h1{font-size:28px;margin:10px 0 4px;letter-spacing:2px}
.brand p{color:#8b95b2;font-size:13.5px;margin:0}
.or{display:flex;align-items:center;gap:10px;color:#6d7796;font-size:12.5px;margin:18px 0 12px}
.or::before,.or::after{content:"";flex:1 1 auto;height:1px;background:#232b47}
.join-row{display:flex;gap:10px}
.join-row input{flex:1 1 auto;letter-spacing:4px;font-size:18px;text-align:center;font-weight:600}
.join-row .btn{flex:0 0 auto;padding:0 22px}
.tip{color:#ffb020;font-size:13px;min-height:20px;margin:12px 0 0;text-align:center}
.foot-note{text-align:center;color:#5f6a88;font-size:12px;margin-top:20px;line-height:1.7}

/* ---------- 房间页 ---------- */
#screen-room{flex-direction:column;overflow:hidden}
.topbar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));
  background:rgba(13,17,32,.94);border-bottom:1px solid #1e2540;backdrop-filter:blur(8px);
}
.room-code-box{display:flex;align-items:center;gap:8px;min-width:0}
.room-code-box .lb{font-size:11.5px;color:#7b86a5}
.room-code-box .code{
  font-size:20px;font-weight:700;letter-spacing:3px;
  background:linear-gradient(135deg,#ffb020,#ff5a3d);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.me-box{display:flex;align-items:center;gap:8px;min-width:0}
.badge{
  background:#242c49;border-radius:8px;padding:3px 8px;font-size:13px;font-weight:700;color:#ffb020;
}
.me-name{font-size:13px;color:#c3cbdd;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 玩家条 */
.players{
  flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;
  padding:10px 12px;background:rgba(11,15,28,.85);border-bottom:1px solid #1e2540;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin;
}
.players::-webkit-scrollbar{height:5px}
.players::-webkit-scrollbar-thumb{background:#2b3453;border-radius:4px}
.pcard{
  flex:0 0 auto;min-width:112px;max-width:170px;padding:8px 10px;border-radius:13px;
  background:#151b2e;border:1px solid #242c47;transition:border-color .18s ease,box-shadow .18s ease;
}
.pcard.active{border-color:#ff6b3d;box-shadow:0 0 0 2px rgba(255,107,61,.22);background:#20182a}
.pcard.offline{opacity:.42}
.pcard .pname{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600}
.pcard .pname b{color:#ffb020;font-size:12.5px}
.pcard .pname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:82px}
.pcard .pname .you{font-style:normal;font-size:10px;background:#2b3453;color:#9fb0d6;border-radius:6px;padding:1px 5px}
.pcard .turnflag{font-size:10.5px;color:#ff8a3d;margin-left:auto;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;max-height:70px;overflow-y:auto}
.chip{font-size:11px;padding:1.5px 6px;border-radius:7px;background:#242c49;color:#c3cbdd}
.chip.empty{background:transparent;color:#4e5878;padding-left:0}

/* 主区 */
.main{
  flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 12px calc(16px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;
}
.main>.card{flex:0 0 auto}
.turn-card{background:linear-gradient(135deg,rgba(255,138,61,.16),rgba(255,61,110,.10)),linear-gradient(180deg,#1a2036,#141a2c)}
.turn-card.mine{border-color:#ff6b3d;box-shadow:0 0 0 2px rgba(255,107,61,.2)}
.turn-title{font-size:19px;font-weight:700;letter-spacing:.5px}
.turn-card.mine .turn-title{color:#ffb020}
.turn-sub{margin-top:8px;font-size:13.5px;color:#a9b3cc}
.turn-sub b{color:#ff8a3d}
.guess-row{display:flex;gap:10px}
.guess-row input{flex:1 1 auto;text-align:center;font-size:19px;font-weight:600;letter-spacing:2px}
.guess-row .btn{flex:0 0 auto;padding:0 24px}
.big{font-size:19px;color:#ffb020}
.over-card{text-align:center}
.over-card .boom{font-size:44px;line-height:1;filter:drop-shadow(0 6px 16px rgba(255,90,60,.5))}
.over-card h2{margin:10px 0 8px;font-size:20px}
.over-line{font-size:15.5px;margin:0}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:flex;align-items:center;gap:10px;font-size:14px;padding:7px 10px;background:#141a2c;border-radius:10px}
.hist .hn{color:#a9b3cc;font-size:13px;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .hv{color:#fff}
.tag{font-size:11.5px;border-radius:7px;padding:1.5px 7px;flex:0 0 auto}
.tag.low{background:rgba(65,140,255,.18);color:#79b0ff}
.tag.high{background:rgba(255,176,32,.18);color:#ffc65c}
.tag.boom{background:rgba(255,61,110,.2);color:#ff7a9c}

/* 弹窗 / toast */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-mask{position:absolute;inset:0;background:rgba(5,8,16,.72);backdrop-filter:blur(3px)}
.modal-card{
  position:relative;width:100%;max-width:380px;text-align:center;
  background:linear-gradient(180deg,#1c2340,#141a2c);border:1px solid #2c3556;
  border-radius:20px;padding:24px 20px;box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation:pop .22s ease;
}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card .boom{font-size:48px;line-height:1;filter:drop-shadow(0 6px 16px rgba(255,90,60,.55))}
.modal-card h2{margin:12px 0 10px;font-size:21px}
.modal-card .over-line{font-size:15.5px;margin:0 0 6px}
.modal-card .btn-row{margin-top:18px}
.toast{
  position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:80;max-width:86vw;padding:11px 18px;border-radius:12px;
  background:rgba(35,44,73,.97);border:1px solid #3a4470;color:#e9edf7;
  font-size:14px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);
}

/* 桌面端微调 */
@media (min-width:760px){
  .main{max-width:760px;width:100%;margin:0 auto;padding-left:20px;padding-right:20px}
  .players{padding-left:calc(50% - 360px);padding-right:calc(50% - 360px)}
  .topbar{padding-left:calc(50% - 368px);padding-right:calc(50% - 368px)}
  .brand h1{font-size:32px}
}
</style>
</head>
<body>

<div id="app">

  <!-- ============ 首页 ============ -->
  <section id="screen-home" class="screen active">
    <div class="home-wrap">
      <div class="brand">
        <div class="logo">💣</div>
        <h1>数字炸弹</h1>
        <p>多人联机 · 设备直连 · 无需服务器</p>
      </div>

      <div class="card">
        <label class="field">
          <span>你的昵称</span>
          <input id="input-name" type="text" maxlength="10" placeholder="例如：小明" autocomplete="off">
        </label>

        <button class="btn primary block" data-action="create" style="margin-top:0">创建房间</button>

        <div class="or"><span>或加入已有房间</span></div>

        <div class="join-row">
          <input id="input-code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位房间号" autocomplete="off">
          <button class="btn" data-action="join">加入</button>
        </div>

        <p id="home-tip" class="tip"></p>
      </div>

      <p class="foot-note">
        两台设备打开同一网址：一方点「创建房间」拿到 6 位房间号，<br>
        另一方输入房间号即可自动建立设备直连（P2P），人数不限。
      </p>
    </div>
  </section>

  <!-- ============ 房间 ============ -->
  <section id="screen-room" class="screen">
    <header class="topbar">
      <div class="room-code-box">
        <span class="lb">房间号</span>
        <span id="room-code" class="code">------</span>
        <button class="mini" data-action="copy-code">复制</button>
      </div>
      <div class="me-box">
        <span id="my-badge" class="badge">#-</span>
        <span id="my-name-view" class="me-name">我</span>
        <button class="mini ghost" data-action="leave">退出</button>
      </div>
    </header>

    <div id="players" class="players"></div>
    <main id="main" class="main"></main>
  </section>

</div>

<div id="modal" class="modal hidden">
  <div class="modal-mask" data-action="close-modal"></div>
  <div class="modal-card" id="modal-card"></div>
</div>

<div id="toast" class="toast hidden"></div>

<!-- PeerJS：优先使用本地 vendor 文件，失败时自动回退 CDN -->
<script src="vendor/peerjs.min.js"></script>
<script>
(function () {
  if (typeof window.Peer === 'function') { window.__peerReady = true; return; }
  var urls = [
    'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
    'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'
  ];
  var i = 0;
  (function next() {
    if (i >= urls.length) return;
    var s = document.createElement('script');
    s.src = urls[i++];
    s.onload = function () { window.__peerReady = true; };
    s.onerror = next;
    document.head.appendChild(s);
  })();
})();
</script>

<script>
/* =====================================================================
   数字炸弹 · 多人联机   (纯前端 / WebRTC P2P / 房主权威节点)
   消息协议：
     客户端 -> 房主 : {t:'join', name} | {t:'guess', value}
     房主 -> 客户端 : {t:'welcome', num, code} | {t:'state', state} | {t:'toast', msg}
   ===================================================================== */
(function () {
  'use strict';

  /* ---------------- 工具 ---------------- */
  function $(id) { return document.getElementById(id); }
  function rand6() {
    var s = '';
    for (var i = 0; i < 6; i++) s += Math.floor(Math.random() * 10);
    return s;
  }
  function digitsOnly(v) { return String(v == null ? '' : v).replace(/[^0-9]/g, ''); }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clampName(v) {
    return String(v == null ? '' : v).replace(/[\s\u0000-\u001f]+/g, ' ').trim().slice(0, 10);
  }
  function pow10(n) { return Math.pow(10, n); }

  /* ---------------- 全局状态 ---------------- */
  var S = {
    role: null,        // 'host' | 'client'
    peer: null,
    code: '',
    myNum: 0,
    myName: '',
    host: null,        // 房主侧权威状态
    bomb: null,        // 房主侧：炸弹真实数值（不下发给其他人）
    pub: null,         // 当前渲染用的公开状态（房主与客户端统一）
    conns: {},         // 房主：peerId -> {conn, num}
    hostConn: null,    // 客户端：到房主的连接
    lastPhase: null,
    busy: false,
    inputCache: { 'input-guess': '', 'input-bomb': '' },
    toastTimer: null
  };
  window.__DBG = S;  // 供自动化测试读取内部状态（房主本身即为权威，无安全影响）

  /* ---------------- 提示 ---------------- */
  function tip(msg) { var el = $('home-tip'); if (el) el.textContent = msg || ''; }
  function toast(msg) {
    var el = $('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.remove('hidden');
    if (S.toastTimer) clearTimeout(S.toastTimer);
    S.toastTimer = setTimeout(function () { el.classList.add('hidden'); }, 2400);
  }
  function openModal(html) { $('modal-card').innerHTML = html; $('modal').classList.remove('hidden'); }
  function closeModal() { $('modal').classList.add('hidden'); }

  /* ---------------- 房主状态 ---------------- */
  function newHostState(code) {
    return {
      code: code,
      phase: 'lobby',            // lobby | playing | over
      turn: 0,
      players: [],               // {num, name, online, guesses:[]}
      history: [],               // {num, name, value, hint}
      range: { min: 0, max: 0 },
      digits: 0,
      winner: null,
      hostNum: 1,
      config: { mode: 'digits', digits: 3, value: '' }
    };
  }
  function hostPublic() {
    var h = S.host;
    return {
      code: h.code,
      phase: h.phase,
      turn: h.turn,
      players: h.players.map(function (p) {
        return { num: p.num, name: p.name, online: p.online, guesses: p.guesses.slice() };
      }),
      history: h.history.slice(),
      range: { min: h.range.min, max: h.range.max },
      digits: h.digits,
      winner: h.winner ? { num: h.winner.num, name: h.winner.name, value: h.winner.value } : null,
      hostNum: h.hostNum
    };
  }
  function findPlayer(num) {
    var ps = S.host.players;
    for (var i = 0; i < ps.length; i++) if (ps[i].num === num) return ps[i];
    return null;
  }
  function allocNum() {
    var used = {};
    S.host.players.forEach(function (p) { used[p.num] = 1; });
    var n = 1;
    while (used[n]) n++;
    return n;
  }
  function nextOnlineNum(curNum) {
    var ps = S.host.players;
    if (!ps.length) return 0;
    var idx = -1;
    for (var i = 0; i < ps.length; i++) if (ps[i].num === curNum) { idx = i; break; }
    for (var k = 1; k <= ps.length; k++) {
      var p = ps[(idx + k + ps.length) % ps.length];
      if (p.online) return p.num;
    }
    return curNum;
  }
  function firstOnlineNum() {
    var ps = S.host.players;
    for (var i = 0; i < ps.length; i++) if (ps[i].online) return ps[i].num;
    return 1;
  }

  /* ---------------- 房主：网络 ---------------- */
  function hostSend(conn, obj) {
    try { if (conn && conn.open) conn.send(obj); } catch (e) { console.warn(e); }
  }
  function hostBroadcast() {
    S.pub = hostPublic();
    var payload = { t: 'state', state: S.pub };
    Object.keys(S.conns).forEach(function (pid) {
      hostSend(S.conns[pid].conn, payload);
    });
    render();
  }
  function bindHost(p) {
    p.on('connection', function (conn) {
      S.conns[conn.peer] = { conn: conn, num: 0 };
      conn.on('open', function () {
        if (!S.conns[conn.peer]) S.conns[conn.peer] = { conn: conn, num: 0 };
      });
      conn.on('data', function (data) {
        try { hostOnData(conn, data); } catch (e) { console.error(e); }
      });
      conn.on('close', function () { hostOnLeave(conn); });
      conn.on('error', function () { hostOnLeave(conn); });
    });
    p.on('disconnected', function () {
      try { p.reconnect(); } catch (e) {}
    });
  }
  function hostOnData(conn, data) {
    if (!data || typeof data !== 'object') return;
    var h = S.host;
    if (!h) return;
    var entry = S.conns[conn.peer];
    if (!entry) { entry = S.conns[conn.peer] = { conn: conn, num: 0 }; }

    if (data.t === 'join') {
      if (!entry.num) {
        entry.num = allocNum();
        h.players.push({
          num: entry.num,
          name: clampName(data.name) || ('玩家' + entry.num),
          online: true,
          guesses: []
        });
      } else {
        var again = findPlayer(entry.num);
        if (again) again.online = true;
      }
      hostSend(conn, { t: 'welcome', num: entry.num, code: h.code });
      hostBroadcast();
      return;
    }
    if (!entry.num) return;
    if (data.t === 'guess') {
      hostGuess(entry.num, data.value, conn);
    }
  }
  function hostOnLeave(conn) {
    var entry = S.conns[conn.peer];
    if (!entry) return;
    delete S.conns[conn.peer];
    var h = S.host;
    if (!h || !entry.num) { hostBroadcast(); return; }
    var p = findPlayer(entry.num);
    if (p) {
      p.online = false;
      if (h.phase === 'playing' && h.turn === p.num) h.turn = nextOnlineNum(p.num);
    }
    hostBroadcast();
  }

  /* ---------------- 房主：游戏逻辑 ---------------- */
  function hostGuess(num, raw, conn) {
    var h = S.host;
    if (!h || h.phase !== 'playing') {
      if (conn) hostSend(conn, { t: 'toast', msg: '游戏尚未开始' });
      return;
    }
    var v = parseInt(digitsOnly(raw), 10);
    if (!isFinite(v) || v <= 0) {
      if (conn) hostSend(conn, { t: 'toast', msg: '请输入正整数' });
      return;
    }
    if (h.turn !== num) {
      if (conn) hostSend(conn, { t: 'toast', msg: '还没轮到你猜' });
      return;
    }
    var p = findPlayer(num);
    if (!p) return;

    p.guesses.push(v);
    var hit = (v === S.bomb);
    var hint = hit ? 'boom' : (v < S.bomb ? 'low' : 'high');
    h.history.push({ num: num, name: p.name, value: v, hint: hint });

    if (hit) {
      h.winner = { num: num, name: p.name, value: v };
      h.phase = 'over';
    } else {
      if (v < S.bomb) h.range.min = Math.max(h.range.min, v + 1);
      else h.range.max = Math.min(h.range.max, v - 1);
      h.turn = nextOnlineNum(num);
    }
    hostBroadcast();
  }
  function hostStart() {
    var h = S.host;
    if (!h) return;
    var cfg = h.config;
    var digits, value;
    if (cfg.mode === 'fixed') {
      var raw = digitsOnly(cfg.value);
      if (!raw || raw === '0' || raw.length > 6) { toast('请输入 1~6 位正整数作为炸弹'); return; }
      value = parseInt(raw, 10);
      digits = raw.length;
    } else {
      digits = Math.min(6, Math.max(1, parseInt(cfg.digits, 10) || 3));
      var lo = (digits === 1 ? 1 : pow10(digits - 1));
      var hi = pow10(digits) - 1;
      value = lo + Math.floor(Math.random() * (hi - lo + 1));
    }
    S.bomb = value;
    h.digits = digits;
    h.range = { min: (digits === 1 ? 1 : pow10(digits - 1)), max: pow10(digits) - 1 };
    h.players.forEach(function (p) { p.guesses = []; });
    h.history = [];
    h.winner = null;
    h.phase = 'playing';
    h.turn = firstOnlineNum();
    S.inputCache['input-guess'] = '';
    closeModal();
    hostBroadcast();
    toast('炸弹已设置：' + digits + ' 位数');
  }
  function hostBackLobby() {
    var h = S.host;
    if (!h) return;
    h.phase = 'lobby';
    h.winner = null;
    h.history = [];
    h.players.forEach(function (p) { p.guesses = []; });
    closeModal();
    hostBroadcast();
  }

  /* ---------------- 渲染 ---------------- */
  function findMe(s) {
    for (var i = 0; i < s.players.length; i++) if (s.players[i].num === S.myNum) return s.players[i];
    return null;
  }
  function playerByNum(s, num) {
    for (var i = 0; i < s.players.length; i++) if (s.players[i].num === num) return s.players[i];
    return null;
  }

  function render() {
    var s = S.pub;
    if (!s) return;

    var focusId = null, selS = null, selE = null;
    var ae = document.activeElement;
    if (ae && ae.id) {
      focusId = ae.id;
      try { selS = ae.selectionStart; selE = ae.selectionEnd; } catch (e) {}
    }
    ['input-guess', 'input-bomb'].forEach(function (id) {
      var el = $(id);
      if (el) S.inputCache[id] = el.value;
    });
    if (S.lastPhase !== s.phase) S.inputCache['input-guess'] = '';

    $('room-code').textContent = s.code;
    $('my-badge').textContent = '#' + (S.myNum || '-');
    var me = findMe(s);
    $('my-name-view').textContent = me ? me.name : '我';

    renderPlayers(s);
    $('main').innerHTML = mainHtml(s);

    if (focusId) {
      var el2 = $(focusId);
      if (el2 && !el2.disabled) {
        el2.focus();
        try { if (selS != null) el2.setSelectionRange(selS, selE); } catch (e) {}
      }
    }

    if (s.phase === 'over' && S.lastPhase !== 'over') openModal(overModalHtml(s));
    if (s.phase !== 'over' && !$('modal').classList.contains('hidden')) closeModal();

    S.lastPhase = s.phase;
  }

  function renderPlayers(s) {
    var html = s.players.map(function (p) {
      var active = (s.phase === 'playing' && s.turn === p.num);
      var cls = 'pcard' + (p.online ? '' : ' offline') + (active ? ' active' : '');
      var chips = p.guesses.length
        ? p.guesses.map(function (g) { return '<span class="chip">' + g + '</span>'; }).join('')
        : '<span class="chip empty">暂无</span>';
      var you = (p.num === S.myNum) ? '<i class="you">我</i>' : '';
      var flag = active ? '<span class="turnflag">猜数中</span>' : '';
      return '<div class="' + cls + '">' +
        '<div class="pname"><b>#' + p.num + '</b><span class="nm">' + esc(p.name) + '</span>' + you + flag + '</div>' +
        '<div class="chips">' + chips + '</div>' +
        '</div>';
    }).join('');
    $('players').innerHTML = html || '<div class="pcard"><div class="pname">等待玩家…</div></div>';
  }

  function mainHtml(s) {
    var h = '';
    if (s.phase === 'lobby') h += lobbyHtml(s);
    else if (s.phase === 'playing') h += playingHtml(s);
    else h += overHtml(s);
    h += historyHtml(s);
    return h;
  }

  function lobbyHtml(s) {
    var h = '';
    h += '<div class="card">';
    h += '<h2>邀请好友加入</h2>';
    h += '<p class="muted">把房间号告诉对方，或发送邀请链接：</p>';
    h += '<p class="muted" style="font-size:22px;letter-spacing:4px;color:#ffb020;font-weight:700;text-align:center;margin:10px 0">' + esc(s.code) + '</p>';
    h += '<div class="btn-row"><button class="btn" data-action="copy-code">复制房间号</button><button class="btn" data-action="copy-link">复制邀请链接</button></div>';
    h += '<p class="hint">对方打开同一网址输入房间号即可入局；游戏开始后也能加入，会自动同步进度。</p>';
    h += '</div>';

    if (S.role === 'host') {
      h += hostSetupHtml(s);
    } else {
      h += '<div class="card"><h2>等待房主设置炸弹</h2><p class="muted">房主设置炸弹后会立即开始，请稍候…</p>' +
           '<p class="hint">当前房间人数：' + s.players.length + ' 人</p></div>';
    }
    return h;
  }

  function hostSetupHtml(s) {
    var cfg = S.host.config;
    var pills = [1, 2, 3, 4, 5, 6].map(function (d) {
      var on = (cfg.mode === 'digits' && parseInt(cfg.digits, 10) === d) ? ' on' : '';
      return '<button class="pill' + on + '" data-action="digit" data-v="' + d + '">' + d + ' 位</button>';
    }).join('');
    var bombVal = S.inputCache['input-bomb'] || '';

    var h = '<div class="card">';
    h += '<h2>设置炸弹（仅房主可操作）</h2>';
    h += '<div class="seg">';
    h += '<button class="seg-btn' + (cfg.mode === 'digits' ? ' on' : '') + '" data-action="mode" data-v="digits">随机位数</button>';
    h += '<button class="seg-btn' + (cfg.mode === 'fixed' ? ' on' : '') + '" data-action="mode" data-v="fixed">指定数字</button>';
    h += '</div>';

    if (cfg.mode === 'digits') {
      h += '<p class="muted">炸弹是几位数？</p>';
      h += '<div class="pills">' + pills + '</div>';
      h += '<p class="hint">系统会在该位数范围内随机生成炸弹，房主自己也不知道具体数字。</p>';
    } else {
      h += '<p class="muted">指定炸弹数字（其他玩家看不到）</p>';
      h += '<input id="input-bomb" inputmode="numeric" maxlength="6" placeholder="例如 472" value="' + esc(bombVal) + '">';
      h += '<p class="hint">1~6 位正整数；发牌后玩家轮流猜，猜中即结束。</p>';
    }
    h += '<button class="btn primary block" data-action="start">开始游戏</button>';
    h += '</div>';
    return h;
  }

  function playingHtml(s) {
    var myTurn = (s.turn === S.myNum);
    var turnP = playerByNum(s, s.turn);
    var turnName = turnP ? ('#' + turnP.num + ' ' + turnP.name) : '—';
    var h = '';

    h += '<div class="card turn-card' + (myTurn ? ' mine' : '') + '">';
    h += '<div class="turn-title">' + (myTurn ? '轮到你猜了！' : '正在猜：' + esc(turnName)) + '</div>';
    h += '<div class="turn-sub">炸弹是 <b>' + s.digits + '</b> 位数';
    if (s.range && s.range.min && s.range.max && s.range.min <= s.range.max) {
      h += ' · 当前范围 <b>' + s.range.min + ' ~ ' + s.range.max + '</b>';
    }
    h += '</div></div>';

    h += '<div class="card">';
    h += '<div class="guess-row">';
    h += '<input id="input-guess" inputmode="numeric" maxlength="6" placeholder="' +
         (myTurn ? '输入你猜的数字' : '还没轮到你') + '" value="' + esc(S.inputCache['input-guess'] || '') + '"' +
         (myTurn ? '' : ' disabled') + '>';
    h += '<button class="btn primary" data-action="guess"' + (myTurn ? '' : ' disabled') + '>猜</button>';
    h += '</div>';
    h += '<p class="hint">' + (myTurn ? '输入数字后点击「猜」或按回车。' : '按顺序轮流猜，猜中炸弹立即结束。') + '</p>';
    h += '</div>';
    return h;
  }

  function overHtml(s) {
    var w = s.winner;
    var h = '<div class="card over-card">';
    h += '<div class="boom">💣</div>';
    h += '<h2>游戏结束</h2>';
    if (w) h += '<p class="over-line"><b>#' + w.num + ' ' + esc(w.name) + '</b> 猜中了炸弹数字 <b class="big">' + w.value + '</b>！</p>';
    h += '<p class="muted">本局共 ' + s.history.length + ' 次猜测</p>';
    if (S.role === 'host') {
      h += '<div class="btn-row"><button class="btn primary" data-action="again">同设置再来一局</button>' +
           '<button class="btn" data-action="lobby">返回大厅</button></div>';
    } else {
      h += '<p class="hint">等待房主开始新一局…</p>';
    }
    h += '</div>';
    return h;
  }

  function historyHtml(s) {
    var h = '<div class="card"><h2>猜测记录</h2>';
    if (!s.history.length) {
      h += '<p class="muted">还没有人猜过。</p>';
    } else {
      h += '<ul class="hist">';
      for (var i = s.history.length - 1; i >= 0; i--) {
        var it = s.history[i];
        var tag = it.hint === 'boom' ? '<span class="tag boom">命中</span>'
                : it.hint === 'low' ? '<span class="tag low">太小</span>'
                : '<span class="tag high">太大</span>';
        h += '<li><span class="hn">#' + it.num + ' ' + esc(it.name) + '</span>' +
             '<b class="hv">' + it.value + '</b>' + tag + '</li>';
      }
      h += '</ul>';
    }
    h += '</div>';
    return h;
  }

  function overModalHtml(s) {
    var w = s.winner;
    var h = '<div class="boom">💣</div><h2>游戏结束</h2>';
    if (w) h += '<p class="over-line"><b>#' + w.num + ' ' + esc(w.name) + '</b> 猜中了炸弹数字 <b class="big">' + w.value + '</b>！</p>';
    h += '<p class="muted">本局共 ' + s.history.length + ' 次猜测</p>';
    h += '<div class="btn-row">';
    if (S.role === 'host') {
      h += '<button class="btn primary" data-action="again">再来一局</button>' +
           '<button class="btn" data-action="lobby">返回大厅</button>';
    } else {
      h += '<button class="btn" data-action="close-modal">知道了</button>';
    }
    h += '</div>';
    return h;
  }

  /* ---------------- 页面切换 ---------------- */
  function enterRoom() {
    $('screen-home').classList.remove('active');
    $('screen-room').classList.add('active');
    S.lastPhase = null;
  }
  function goHome() {
    closeModal();
    cleanup();
    $('screen-room').classList.remove('active');
    $('screen-home').classList.add('active');
    tip('');
  }
  function cleanup() {
    try { if (S.hostConn) S.hostConn.close(); } catch (e) {}
    try { if (S.peer) S.peer.destroy(); } catch (e) {}
    S.peer = null; S.hostConn = null; S.conns = {};
    S.role = null; S.host = null; S.pub = null; S.bomb = null;
    S.myNum = 0; S.code = ''; S.lastPhase = null; S.busy = false;
    S.inputCache = { 'input-guess': '', 'input-bomb': '' };
  }

  /* ---------------- 房主：创建房间 ---------------- */
  function doCreate() {
    if (S.busy) return;
    if (typeof window.Peer !== 'function') { tip('PeerJS 尚未加载完成，请稍候或检查网络'); return; }
    S.myName = clampName($('input-name').value) || '房主';
    S.busy = true;
    tip('正在创建房间…');
    var attempt = 0;
    (function tryOnce() {
      attempt++;
      var code = rand6();
      var p;
      try { p = new Peer('sdb-' + code, { debug: 1 }); }
      catch (err) { S.busy = false; tip('初始化失败：' + err.message); return; }
      var opened = false;
      p.on('open', function () {
        opened = true;
        S.busy = false;
        S.role = 'host';
        S.peer = p;
        S.code = code;
        S.myNum = 1;
        S.host = newHostState(code);
        S.host.players.push({ num: 1, name: S.myName, online: true, guesses: [] });
        bindHost(p);
        enterRoom();
        hostBroadcast();
        tip('');
        toast('房间已创建：' + code);
      });
      p.on('error', function (err) {
        if (opened) { console.warn('[host peer error]', err); return; }
        try { p.destroy(); } catch (e) {}
        var t = err && err.type;
        if (t === 'unavailable-id' && attempt < 8) { setTimeout(tryOnce, 80); return; }
        S.busy = false;
        tip('创建房间失败（' + (t || '未知错误') + '），请重试');
      });
    })();
  }

  /* ---------------- 客户端：加入房间 ---------------- */
  function doJoin() {
    if (S.busy) return;
    if (typeof window.Peer !== 'function') { tip('PeerJS 尚未加载完成，请稍候或检查网络'); return; }
    var code = digitsOnly($('input-code').value);
    if (code.length !== 6) { tip('请输入 6 位房间号'); return; }
    S.myName = clampName($('input-name').value) || '玩家';
    S.busy = true;
    tip('正在连接房主…');

    var p;
    try { p = new Peer(null, { debug: 1 }); }
    catch (err) { S.busy = false; tip('初始化失败：' + err.message); return; }
    S.peer = p;

    var settled = false;
    var timer = setTimeout(function () {
      if (settled) return;
      settled = true;
      S.busy = false;
      try { p.destroy(); } catch (e) {}
      tip('连接超时：房间不存在或网络不通');
    }, 20000);

    function finish() { settled = true; clearTimeout(timer); S.busy = false; }

    p.on('open', function () {
      var conn;
      try { conn = p.connect('sdb-' + code, { reliable: true, serialization: 'json' }); }
      catch (e) { finish(); tip('连接失败：' + e.message); return; }
      S.hostConn = conn;

      conn.on('open', function () {
        conn.send({ t: 'join', name: S.myName });
      });
      conn.on('data', function (data) {
        if (!data || typeof data !== 'object') return;
        if (data.t === 'welcome') {
          finish();
          S.role = 'client';
          S.code = data.code || code;
          S.myNum = data.num;
          enterRoom();
          tip('');
          toast('已加入房间，你是 #' + data.num + ' 号');
        } else if (data.t === 'state') {
          S.pub = data.state;
          render();
        } else if (data.t === 'toast') {
          toast(data.msg);
        }
      });
      conn.on('close', function () {
        if (!settled) { finish(); try { p.destroy(); } catch (e) {} tip('加入失败：房间不存在或房主已离开'); }
        else {
          openModal('<div class="boom">⚡</div><h2>连接已断开</h2>' +
            '<p class="muted">与房主的连接已中断，房间可能已关闭。</p>' +
            '<div class="btn-row"><button class="btn primary" data-action="home">返回首页</button></div>');
        }
      });
      conn.on('error', function (e) { console.warn('[conn error]', e); });
    });

    p.on('error', function (err) {
      var t = err && err.type;
      if (t === 'peer-unavailable') {
        if (!settled) { finish(); try { p.destroy(); } catch (e) {} tip('房间不存在，请检查 6 位房间号'); }
        return;
      }
      console.warn('[client peer error]', err);
    });
  }

  /* ---------------- 操作 ---------------- */
  function doGuess() {
    var s = S.pub;
    if (!s || s.phase !== 'playing') return;
    var el = $('input-guess');
    if (!el) return;
    var raw = digitsOnly(el.value);
    if (!raw) { toast('请输入要猜的数字'); return; }
    if (s.turn !== S.myNum) { toast('还没轮到你猜'); return; }
    var val = parseInt(raw, 10);
    S.inputCache['input-guess'] = '';
    el.value = '';
    if (S.role === 'host') hostGuess(1, val, null);
    else if (S.hostConn && S.hostConn.open) S.hostConn.send({ t: 'guess', value: val });
    else toast('连接已断开');
  }

  function copyText(text, okMsg) {
    var done = function () { toast(okMsg + '：' + text); };
    var bad = function () { toast('复制失败，请手动记录：' + text); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done)['catch'](function () { legacyCopy(text, done, bad); });
    } else {
      legacyCopy(text, done, bad);
    }
  }
  function legacyCopy(text, ok, bad) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var r = document.execCommand('copy');
      document.body.removeChild(ta);
      if (r) ok(); else bad();
    } catch (e) { bad(); }
  }
  function shareLink() {
    var base = location.href.split('#')[0].split('?')[0];
    return base + '?room=' + S.code;
  }

  function doLeave() {
    if (S.role === 'host') {
      if (!window.confirm('你是房主，退出后房间将关闭，其他玩家会被断开。确定退出吗？')) return;
    }
    goHome();
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-action]') : null;
    if (!el) return;
    var act = el.getAttribute('data-action');
    if (act === 'create') doCreate();
    else if (act === 'join') doJoin();
    else if (act === 'copy-code') copyText(S.code, '房间号已复制');
    else if (act === 'copy-link') copyText(shareLink(), '邀请链接已复制');
    else if (act === 'leave') doLeave();
    else if (act === 'home') goHome();
    else if (act === 'mode') { if (S.host) { S.host.config.mode = (el.getAttribute('data-v') === 'fixed' ? 'fixed' : 'digits'); render(); } }
    else if (act === 'digit') { if (S.host) { S.host.config.digits = parseInt(el.getAttribute('data-v'), 10) || 3; render(); } }
    else if (act === 'start' || act === 'again') hostStart();
    else if (act === 'lobby') hostBackLobby();
    else if (act === 'guess') doGuess();
    else if (act === 'close-modal') { if (S.role !== 'host') closeModal(); }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.id) return;
    if (t.id === 'input-guess') S.inputCache['input-guess'] = digitsOnly(t.value);
    if (t.id === 'input-bomb') {
      S.inputCache['input-bomb'] = digitsOnly(t.value);
      if (S.host) S.host.config.value = S.inputCache['input-bomb'];
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var t = e.target;
    if (!t || !t.id) return;
    if (t.id === 'input-code') { e.preventDefault(); doJoin(); }
    else if (t.id === 'input-guess') { e.preventDefault(); doGuess(); }
  });

  window.addEventListener('beforeunload', function () {
    try { if (S.hostConn) S.hostConn.close(); } catch (e) {}
    try { if (S.peer) S.peer.destroy(); } catch (e) {}
  });

  /* ---------------- 启动 ---------------- */
  function initApp() {
    var m = location.search.match(/[?&]room=(\d{6})/);
    if (m) {
      var el = $('input-code');
      if (el) el.value = m[1];
      tip('已自动填入房间号，点击「加入」即可进入房间');
    }
  }
  function bootstrap() {
    if (typeof window.Peer === 'function') { initApp(); return; }
    var tries = 0;
    var t = setInterval(function () {
      if (typeof window.Peer === 'function') { clearInterval(t); initApp(); }
      else if (++tries > 120) {
        clearInterval(t);
        tip('PeerJS 加载失败：请检查网络，或将 peerjs.min.js 放到 vendor 目录');
      }
    }, 100);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootstrap);
  else bootstrap();
})();
</script>
</body>
</html>
