<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0d16">
<meta name="description" content="数字炸弹 · 多人联机网页游戏，基于 WebRTC 设备直连，无需服务器存游戏数据。">
<title>数字炸弹 · 多人联机</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='30' cy='38' r='22' fill='%23141a2b'/%3E%3Crect x='26' y='6' width='9' height='11' rx='3' fill='%23838ea1'/%3E%3Cpath d='M35 8q11-6 17 5' stroke='%23ff8a3d' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  height:100%;margin:0;overflow:hidden;
  background:#0a0d16;
  background-image:radial-gradient(900px 480px at 50% -10%,rgba(255,95,60,.20),transparent 62%),radial-gradient(760px 460px at 105% 105%,rgba(95,115,255,.16),transparent 60%);
  color:#e9edf7;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;
}
input,button,select{font-family:inherit;font-size:16px}
.hidden{display:none !important}
.muted{color:#8b95b2;font-size:14px;margin:6px 0}
.hint{color:#7b86a5;font-size:12.5px;line-height:1.6;margin:10px 0 0}
h1,h2,h3{margin:0}
h2{font-size:16px;margin-bottom:10px}

/* ---------- 通用组件 ---------- */
.card{
  background:linear-gradient(180deg,rgba(26,32,54,.95),rgba(20,25,43,.95));
  border:1px solid #232b47;border-radius:16px;padding:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.btn{
  border:0;border-radius:12px;height:48px;padding:0 18px;
  background:#242c49;color:#e9edf7;font-weight:600;cursor:pointer;
  transition:transform .12s ease,filter .12s ease,opacity .12s ease;
  display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#ff8a3d,#ff3d6e);color:#fff;box-shadow:0 8px 20px rgba(255,80,90,.28)}
.btn.block{width:100%;margin-top:14px}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1 1 0;padding:0 10px}
input[type=text],input[type=number],input:not([type]){
  width:100%;height:48px;border-radius:12px;border:1px solid #28304d;
  background:#0f1424;color:#e9edf7;padding:0 14px;outline:none;
  transition:border-color .15s ease;
}
input:focus{border-color:#ff6b3d}
input:disabled{opacity:.5}
label.field{display:block;margin-bottom:14px}
label.field>span{display:block;font-size:13px;color:#8b95b2;margin-bottom:6px}
.mini{
  border:1px solid #2c3556;background:#1b2238;color:#c8d1e6;
  border-radius:9px;height:30px;padding:0 10px;font-size:12.5px;cursor:pointer;
}
.mini.ghost{background:transparent}
.pill{
  border:1px solid #2c3556;background:#161c30;color:#c8d1e6;border-radius:999px;
  height:38px;padding:0 14px;font-size:14px;cursor:pointer;
}
.pill.on{background:linear-gradient(135deg,#ff8a3d,#ff3d6e);border-color:transparent;color:#fff;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.seg{display:flex;background:#0f1424;border:1px solid #28304d;border-radius:12px;padding:4px;margin-bottom:14px}
.seg-btn{
  flex:1 1 0;border:0;background:transparent;color:#8b95b2;height:38px;
  border-radius:9px;cursor:pointer;font-size:14.5px;
}
.seg-btn.on{background:#242c49;color:#fff;font-weight:600}

/* ---------- 首页 ---------- */
.screen{display:none;height:100%}
.screen.active{display:flex;flex-direction:column}
#screen-home{overflow-y:auto}
.home-wrap{margin:auto;width:100%;max-width:440px;padding:28px 18px calc(28px + env(safe-area-inset-bottom))}
.brand{text-align:center;margin-bottom:22px}
.logo{font-size:52px;line-height:1;filter:drop-shadow(0 6px 18px rgba(255,90,60,.5))}
.brand h1{font-size:28px;margin:10px 0 4px;letter-spacing:2px}
.brand p{color:#8b95b2;font-size:13.5px;margin:0}
.or{display:flex;align-items:center;gap:10px;color:#6d7796;font-size:12.5px;margin:18px 0 12px}
.or::before,.or::after{content:"";flex:1 1 auto;height:1px;background:#232b47}
.join-row{display:flex;gap:10px}
.join-row input{flex:1 1 auto;letter-spacing:4px;font-size:18px;text-align:center;font-weight:600}
.join-row .btn{flex:0 0 auto;padding:0 22px}
.tip{color:#ffb020;font-size:13px;min-height:20px;margin:12px 0 0;text-align:center}
.foot-note{text-align:center;color:#5f6a88;font-size:12px;margin-top:20px;line-height:1.7}

/* ---------- 房间页 ---------- */
#screen-room{flex-direction:column;overflow:hidden}
.topbar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));
  background:rgba(13,17,32,.94);border-bottom:1px solid #1e2540;backdrop-filter:blur(8px);
}
.room-code-box{display:flex;align-items:center;gap:8px;min-width:0}
.room-code-box .lb{font-size:11.5px;color:#7b86a5}
.room-code-box .code{
  font-size:20px;font-weight:700;letter-spacing:3px;
  background:linear-gradient(135deg,#ffb020,#ff5a3d);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.me-box{display:flex;align-items:center;gap:8px;min-width:0}
.badge{
  background:#242c49;border-radius:8px;padding:3px 8px;font-size:13px;font-weight:700;color:#ffb020;
}
.me-name{font-size:13px;color:#c3cbdd;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 玩家条 */
.players{
  flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;
  padding:10px 12px;background:rgba(11,15,28,.85);border-bottom:1px solid #1e2540;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin;
}
.players::-webkit-scrollbar{height:5px}
.players::-webkit-scrollbar-thumb{background:#2b3453;border-radius:4px}
.pcard{
  flex:0 0 auto;min-width:112px;max-width:170px;padding:8px 10px;border-radius:13px;
  background:#151b2e;border:1px solid #242c47;transition:border-color .18s ease,box-shadow .18s ease;
}
.pcard.active{border-color:#ff6b3d;box-shadow:0 0 0 2px rgba(255,107,61,.22);background:#20182a}
.pcard.offline{opacity:.42}
.pcard .pname{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600}
.pcard .pname b{color:#ffb020;font-size:12.5px}
.pcard .pname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:82px}
.pcard .pname .you{font-style:normal;font-size:10px;background:#2b3453;color:#9fb0d6;border-radius:6px;padding:1px 5px}
.pcard .turnflag{font-size:10.5px;color:#ff8a3d;margin-left:auto;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;max-height:70px;overflow-y:auto}
.chip{font-size:11px;padding:1.5px 6px;border-radius:7px;background:#242c49;color:#c3cbdd}
.chip.empty{background:transparent;color:#4e5878;padding-left:0}

/* 主区 */
.main{
  flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 12px calc(16px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;
}
.main>.card{flex:0 0 auto}
.turn-card{background:linear-gradient(135deg,rgba(255,138,61,.16),rgba(255,61,110,.10)),linear-gradient(180deg,#1a2036,#141a2c)}
.turn-card.mine{border-color:#ff6b3d;box-shadow:0 0 0 2px rgba(255,107,61,.2)}
.turn-title{font-size:19px;font-weight:700;letter-spacing:.5px}
.turn-card.mine .turn-title{color:#ffb020}
.turn-sub{margin-top:8px;font-size:13.5px;color:#a9b3cc}
.turn-sub b{color:#ff8a3d}
.guess-row{display:flex;gap:10px}
.guess-row input{flex:1 1 auto;text-align:center;font-size:19px;font-weight:600;letter-spacing:2px}
.guess-row .btn{flex:0 0 auto;padding:0 24px}
.big{font-size:19px;color:#ffb020}
.over-card{text-align:center}
.over-card .boom{font-size:44px;line-height:1;filter:drop-shadow(0 6px 16px rgba(255,90,60,.5))}
.over-card h2{margin:10px 0 8px;font-size:20px}
.over-line{font-size:15.5px;margin:0}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:flex;align-items:center;gap:10px;font-size:14px;padding:7px 10px;background:#141a2c;border-radius:10px}
.hist .hn{color:#a9b3cc;font-size:13px;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .hv{color:#fff}
.tag{font-size:11.5px;border-radius:7px;padding:1.5px 7px;flex:0 0 auto}
.tag.low{background:rgba(65,140,255,.18);color:#79b0ff}
.tag.high{background:rgba(255,176,32,.18);color:#ffc65c}
.tag.boom{background:rgba(255,61,110,.2);color:#ff7a9c}

/* 弹窗 / toast */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-mask{position:absolute;inset:0;background:rgba(5,8,16,.72);backdrop-filter:blur(3px)}
.modal-card{
  position:relative;width:100%;max-width:380px;text-align:center;
  background:linear-gradient(180deg,#1c2340,#141a2c);border:1px solid #2c3556;
  border-radius:20px;padding:24px 20px;box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation:pop .22s ease;
}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card .boom{font-size:48px;line-height:1;filter:drop-shadow(0 6px 16px rgba(255,90,60,.55))}
.modal-card h2{margin:12px 0 10px;font-size:21px}
.modal-card .over-line{font-size:15.5px;margin:0 0 6px}
.modal-card .btn-row{margin-top:18px}
.toast{
  position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:80;max-width:86vw;padding:11px 18px;border-radius:12px;
  background:rgba(35,44,73,.97);border:1px solid #3a4470;color:#e9edf7;
  font-size:14px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);
}

/* ---------- 真心话大冒险 ---------- */
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch-row .lb{font-size:14.5px;font-weight:600;color:#e9edf7}
.switch-row .sd{font-size:12.5px;color:#7b86a5;margin-top:4px;line-height:1.5}
.switch{position:relative;flex:0 0 auto;width:48px;height:28px;border-radius:999px;background:#242c49;
  border:1px solid #2c3556;cursor:pointer;transition:background .18s ease,border-color .18s ease}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;
  background:#8b95b2;transition:transform .18s ease,background .18s ease}
.switch.on{background:linear-gradient(135deg,#ff8a3d,#ff3d6e);border-color:transparent}
.switch.on::after{transform:translateX(20px);background:#fff}
/* 游戏结束惩罚设置：内嵌在「设置炸弹」卡片内、开始游戏按钮上方（开关关闭时模式区不渲染、不占位） */
.penalty-box{margin-top:16px;padding-top:14px;border-top:1px solid #232b47}
.penalty-box .pills{margin:12px 0 0}
.pills-2{display:flex;gap:8px}
.pills-2 .pill{flex:1 1 0;min-width:0;padding:0 8px;white-space:nowrap;text-align:center}
.penalty-tip{margin:12px 0 0;font-size:13px;color:#ffb020;letter-spacing:.5px}
.pick-card{padding:18px 16px}
.pick-card h2{font-size:16px;text-align:center;color:#c8d1e6;margin-bottom:14px;letter-spacing:.5px}
.pick-btn{width:100%;height:64px;font-size:20px;font-weight:700;border-radius:14px;letter-spacing:2px}
.pick-btn + .pick-btn{margin-top:12px}
.pick-btn.dare{background:linear-gradient(135deg,#ff8a3d,#ff3d6e);color:#fff;box-shadow:0 8px 22px rgba(255,80,90,.3)}
.pick-btn.truth{background:#242c49;color:#e9edf7}
.q-card{text-align:center;padding:26px 20px;background:linear-gradient(180deg,#1c2340,#141a2c);
  border:1px solid #2c3556;border-radius:20px;box-shadow:0 12px 34px rgba(0,0,0,.4);animation:pop .22s ease}
.q-kicker{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:2px;border-radius:999px;
  padding:4px 12px;margin-bottom:18px}
.q-kicker.truth{background:rgba(255,138,61,.16);color:#ffb020;border:1px solid #45331f}
.q-kicker.dare{background:rgba(65,140,255,.16);color:#79b0ff;border:1px solid #26375c}
.q-text{font-size:21px;line-height:1.85;font-weight:600;color:#fff;letter-spacing:.5px;word-break:break-word}
.q-foot{margin-top:18px;font-size:12px;color:#6d7796}
.drink-banner{margin-top:14px;background:rgba(255,138,61,.16);border:1px solid #ff8a3d;border-radius:14px;padding:14px;text-align:center}
.drink-banner b{font-size:19px;color:#ffb020}
.drink-banner p{margin:6px 0 0;font-size:13px;color:#c8d1e6}
.skip-note{text-align:center;font-size:12.5px;color:#8b95b2;margin-top:10px}
.tada-wrap{margin:auto;width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
.tada-layer{position:fixed;inset:0;z-index:70;display:flex;padding:20px;background:rgba(5,8,16,.86);
  backdrop-filter:blur(4px);overflow-y:auto;animation:pop .2s ease}
.tada-layer.hidden{display:none}
.tada-head{text-align:center;font-size:17px;font-weight:700;letter-spacing:.5px;color:#ffb020;line-height:1.6}
.tada-head b{color:#fff}
/* ---------- 大转盘（融合版，居中页只留转盘+按钮+一行结果） ---------- */
.wheel-wrap{margin:auto;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:14px;background:#0b0f1c;border:1px solid #232b47;border-radius:20px;padding:20px 16px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.wheel-box{position:relative;width:min(320px,84vw);height:min(320px,84vw)}
.wheel-canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 14px 34px rgba(0,0,0,.45);border:4px solid #232b47}
.wheel-pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:42px solid #ff2d55;z-index:3;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.wheel-result{min-height:56px;width:100%;text-align:center;font-size:17px;line-height:1.7;color:#e9edf7}
.wheel-result b{color:#ffb020}
.wheel-result-empty{min-height:56px}
.wheel-btns{display:flex;gap:10px;width:100%}
.wheel-btns .btn{flex:1;white-space:nowrap;padding:0 6px;font-size:14px}
.wheel-confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
@media (min-width:760px){.q-text{font-size:23px}}

/* 桌面端微调 */
@media (min-width:760px){
  .main{max-width:760px;width:100%;margin:0 auto;padding-left:20px;padding-right:20px}
  .players{padding-left:calc(50% - 360px);padding-right:calc(50% - 360px)}
  .topbar{padding-left:calc(50% - 368px);padding-right:calc(50% - 368px)}
  .brand h1{font-size:32px}
}
</style>
</head>
<body>

<div id="app">

  <!-- ============ 首页 ============ -->
  <section id="screen-home" class="screen active">
    <div class="home-wrap">
      <div class="brand">
        <div class="logo">💣</div>
        <h1>数字炸弹</h1>
        <p>多人联机 · 设备直连 · 无需服务器</p>
      </div>

      <div class="card">
        <label class="field">
          <span>你的昵称</span>
          <input id="input-name" type="text" maxlength="10" placeholder="例如：小明" autocomplete="off">
        </label>

        <button class="btn primary block" data-action="create" style="margin-top:0">创建房间</button>

        <div class="or"><span>或加入已有房间</span></div>

        <div class="join-row">
          <input id="input-code" type="text" inputmode="numeric" maxlength="3" placeholder="3 位房号" autocomplete="off">
          <button class="btn" data-action="join">加入</button>
        </div>

        <p id="home-tip" class="tip"></p>
      </div>

      <div class="card">
        <p class="muted" style="margin:0 0 14px">不用建房、不用联机，直接开抽：真心话 / 大冒险 二选一，抽到就得上。</p>
        <button class="btn block" data-action="solo-tada" style="margin-top:0">单独玩 · 真心话大冒险</button>
      </div>

      <p class="foot-note">
        两台设备打开同一网址：一方点「创建房间」拿到 3 位房号，<br>
        另一方输入房间号即可自动建立设备直连（P2P），人数不限。
      </p>
    </div>
  </section>

  <!-- ============ 房间 ============ -->
  <section id="screen-room" class="screen">
    <header class="topbar">
      <div class="room-code-box">
        <span class="lb">房间号</span>
        <span id="room-code" class="code">------</span>
        <button class="mini" data-action="copy-code">复制</button>
      </div>
      <div class="me-box">
        <span id="my-badge" class="badge">#-</span>
        <span id="my-name-view" class="me-name">我</span>
        <button class="mini ghost" data-action="leave">退出</button>
      </div>
    </header>

    <div id="players" class="players"></div>
    <main id="main" class="main"></main>
  </section>

  <!-- ============ 单独玩 · 真心话大冒险 ============ -->
  <section id="screen-tada" class="screen">
    <header class="topbar">
      <div class="room-code-box">
        <span class="lb">玩法</span>
        <span class="code" style="font-size:17px;letter-spacing:1px">真心话大冒险</span>
      </div>
      <div class="me-box">
        <button class="mini ghost" data-action="solo-exit">退出</button>
      </div>
    </header>
    <main id="tada-main" class="main"></main>
  </section>

</div>

<div id="modal" class="modal hidden">
  <div class="modal-mask" data-action="close-modal"></div>
  <div class="modal-card" id="modal-card"></div>
</div>

<div id="toast" class="toast hidden"></div>

<!-- 页内全屏「真心话大冒险」层（联机惩罚用，不跳转页面） -->
<div id="tada-layer" class="tada-layer hidden"></div>

<!-- PeerJS：优先使用本地 vendor 文件，失败时自动回退 CDN -->
<script src="vendor/peerjs.min.js"></script>
<!-- 真心话大冒险：题库 + 抽题算法（与独立版共用同一份数据源，缺失时不影响数字炸弹本体） -->
<script src="truth-dare.js"></script>
<script>
(function () {
  if (typeof window.Peer === 'function') { window.__peerReady = true; return; }
  var urls = [
    'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
    'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'
  ];
  var i = 0;
  (function next() {
    if (i >= urls.length) return;
    var s = document.createElement('script');
    s.src = urls[i++];
    s.onload = function () { window.__peerReady = true; };
    s.onerror = next;
    document.head.appendChild(s);
  })();
})();
</script>

<script>
/* =====================================================================
   数字炸弹 · 多人联机   (纯前端 / WebRTC P2P / 房主权威节点)
   消息协议：
     客户端 -> 房主 : {t:'join', name} | {t:'guess', value}
     房主 -> 客户端 : {t:'welcome', num, code} | {t:'state', state} | {t:'toast', msg}
   ===================================================================== */
(function () {
  'use strict';

  /* ---------------- 工具 ---------------- */
  function $(id) { return document.getElementById(id); }
  function rand6() {
    var s = '';
    for (var i = 0; i < 3; i++) s += Math.floor(Math.random() * 10);
    return s;
  }
  function digitsOnly(v) { return String(v == null ? '' : v).replace(/[^0-9]/g, ''); }
  /* 严格解析猜测值：只接受纯数字（可含首尾空白）；空值、负数、小数、含其它字符一律返回 NaN */
  function parseIntStrict(v) {
    var s = String(v == null ? '' : v).trim();
    if (!/^[0-9]+$/.test(s)) return NaN;
    var n = parseInt(s, 10);
    return isFinite(n) ? n : NaN;
  }
  /* 猜测值必须落在当前可猜闭区间 [range.min, range.max] 内（含边界） */
  function inGuessRange(v, range) {

  /* ---------------- 全局状态 ---------------- */
  var S = {
    role: null,        // 'host' | 'client'

    code: '',
    myNum: 0,
    myName: '',
    host: null,        // 房主侧权威状态
    bomb: null,        // 房主侧：炸弹真实数值（不下发给其他人）
    pub: null,         // 当前渲染用的公开状态（房主与客户端统一）
    conns: {},         // 房主：peerId -> {conn, num}
    hostConn: null,    // 客户端：到房主的连接
    lastPhase: null,
    busy: false,
    tadaDeck: null,    // 房主侧：本轮联机真心话大冒险的抽题器（房主抽题，P2P 同步）
    wheelPrevAngle: 0,  // 大转盘：上次渲染已转到的累计角度（防重渲染跳变）
    wheelPrevTarget: -1, // 大转盘：上次渲染的目标格
    wheelConfettiFor: -1, // 大转盘：已撒花的那一格（每格只撒一次）
    wheelTimer: null,   // 房主侧：转盘转完后置 wheelDone 的定时器
    // 单独玩 · 真心话大冒险（不建房、不联机）
    solo: { mode: null, deck: null, kind: null, text: '', cat: '', drawn: 0 },
    inputCache: { 'input-guess': '', 'input-bomb': '' },
    toastTimer: null
  };
  window.__DBG = S;  // 供自动化测试读取内部状态（房主本身即为权威，无安全影响）

  /* ---------------- 提示 ---------------- */
  function tip(msg) { var el = $('home-tip'); if (el) el.textContent = msg || ''; }
  function toast(msg) {
    var el = $('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.remove('hidden');
    if (S.toastTimer) clearTimeout(S.toastTimer);
    S.toastTimer = setTimeout(function () { el.classList.add('hidden'); }, 2400);
  }
  function openModal(html) { $('modal-card').innerHTML = html; $('modal').classList.remove('hidden'); }
  function closeModal() { $('modal').classList.add('hidden'); }

  /* ---------------- 房主状态 ---------------- */
  function newHostState(code) {
    return {
      code: code,
      phase: 'lobby',            // lobby | playing | over
      turn: 0,
      players: [],               // {num, name, online, guesses:[]}
      history: [],               // {num, name, value, hint}
      range: { min: 0, max: 0 },
      digits: 0,
      winner: null,
      hostNum: 1,
      config: { mode: 'digits', digits: 2, value: '' },
      // 游戏结束惩罚（真心话大冒险）——房主可操作，变更即同步给联机玩家
      penalty: { enabled: true, mode: 'date', kind: 'tada' },
      penaltySkips: 0,    // 本局炸弹的惩罚已换题次数（真心话+大冒险合计，关了重开也不清零）
      penaltyDrink: false, // 本局已换满 3 次，须先喝一杯
      penaltyDone: false,  // 本局惩罚已完成/已认罚，关了不能再重开
      tada: null          // 联机会话：{open, kind, text, cat, drawn, by}
    };
  }
  function hostPublic() {
    var h = S.host;
    return {
      code: h.code,
      phase: h.phase,
      turn: h.turn,
      players: h.players.map(function (p) {
        return { num: p.num, name: p.name, online: p.online, guesses: p.guesses.slice() };
      }),
      history: h.history.slice(),
      range: { min: h.range.min, max: h.range.max },
      digits: h.digits,
      winner: h.winner ? { num: h.winner.num, name: h.winner.name, value: h.winner.value } : null,
      hostNum: h.hostNum,
      penalty: { enabled: !!h.penalty.enabled, mode: h.penalty.mode, kind: h.penalty.kind || 'tada' },
      penaltyDone: !!h.penaltyDone,
      tada: h.tada ? {
        open: !!h.tada.open, kind: h.tada.kind, text: h.tada.text,
        cat: h.tada.cat, drawn: h.tada.drawn, by: h.tada.by,
        skips: h.tada.skips || 0, skipLimit: 3, drink: !!h.tada.drink,
        wheelTarget: (h.tada.wheelTarget != null ? h.tada.wheelTarget : -1),
        wheelAngle: h.tada.wheelAngle || 0, wheelDone: !!h.tada.wheelDone,
        wheelVer: h.tada.wheelVer || 'date'

  }
  function findPlayer(num) {
    var ps = S.host.players;
    for (var i = 0; i < ps.length; i++) if (ps[i].num === num) return ps[i];
    return null;
  }
  function allocNum() {
    var used = {};
    S.host.players.forEach(function (p) { used[p.num] = 1; });
    var n = 1;
    while (used[n]) n++;
    return n;
  }
  function nextOnlineNum(curNum) {
    var ps = S.host.players;
    if (!ps.length) return 0;
    var idx = -1;
    for (var i = 0; i < ps.length; i++) if (ps[i].num === curNum) { idx = i; break; }
    for (var k = 1; k <= ps.length; k++) {
      var p = ps[(idx + k + ps.length) % ps.length];
      if (p.online) return p.num;
    }
    return curNum;
  }
  function firstOnlineNum() {
    var ps = S.host.players;
    for (var i = 0; i < ps.length; i++) if (ps[i].online) return ps[i].num;
    return 1;
  }

  /* ---------------- 房主：网络 ---------------- */
  function hostSend(conn, obj) {
    try { if (conn && conn.open) conn.send(obj); } catch (e) { console.warn(e); }
  }
  function hostBroadcast() {
    S.pub = hostPublic();
    var payload = { t: 'state', state: S.pub };
    Object.keys(S.conns).forEach(function (pid) {
      hostSend(S.conns[pid].conn, payload);
    });
    render();
  }
  function bindHost(p) {
    p.on('connection', function (conn) {
      S.conns[conn.peer] = { conn: conn, num: 0 };
      conn.on('open', function () {
        if (!S.conns[conn.peer]) S.conns[conn.peer] = { conn: conn, num: 0 };
      });
      conn.on('data', function (data) {
        try { hostOnData(conn, data); } catch (e) { console.error(e); }
      });
      conn.on('close', function () { hostOnLeave(conn); });
      conn.on('error', function () { hostOnLeave(conn); });
    });
    p.on('disconnected', function () {
      try { p.reconnect(); } catch (e) {}
    });
  }
  function hostOnData(conn, data) {
    if (!data || typeof data !== 'object') return;
    var h = S.host;
    if (!h) return;
    var entry = S.conns[conn.peer];
    if (!entry) { entry = S.conns[conn.peer] = { conn: conn, num: 0 }; }

    if (data.t === 'join') {
      if (!entry.num) {
        entry.num = allocNum();
        h.players.push({
          num: entry.num,
          name: clampName(data.name) || ('玩家' + entry.num),
          online: true,
          guesses: []
        });
      } else {
        var again = findPlayer(entry.num);
        if (again) again.online = true;
      }
      hostSend(conn, { t: 'welcome', num: entry.num, code: h.code });
      hostBroadcast();
      return;
    }
    if (!entry.num) return;
    if (data.t === 'tada') {
      // 真心话大冒险：一律由房主抽题后广播，保证所有玩家看到同一道题
      // 选真心话/大冒险那一步谁都能点；进去题目后，换题/完成只有被罚的人能点，房主端按发送者编号拦截
      if (data.act === 'open') hostTadaOpen();
      else if (data.act === 'pick') hostTadaPick(data.kind);
      else if (data.act === 'next') hostTadaNext(entry.num);
      else if (data.act === 'close') hostTadaClose(entry.num);
      else if (data.act === 'wheel-spin') hostWheelSpin(entry.num);
      else if (data.act === 'wheel-drink') hostWheelDrink(entry.num);
      else if (data.act === 'wheel-done') hostWheelDone(entry.num);
      return;
    }
    if (data.t === 'guess') {
      hostGuess(entry.num, data.value, conn);
    }
  }
  function hostOnLeave(conn) {
    var entry = S.conns[conn.peer];
    if (!entry) return;
    delete S.conns[conn.peer];
    var h = S.host;
    if (!h || !entry.num) { hostBroadcast(); return; }
    var p = findPlayer(entry.num);
    if (p) {
      p.online = false;
      if (h.phase === 'playing' && h.turn === p.num) h.turn = nextOnlineNum(p.num);
    }
    hostBroadcast();
  }

  /* ---------------- 房主：游戏逻辑 ---------------- */
  function hostGuess(num, raw, conn) {
    var h = S.host;
    if (!h || h.phase !== 'playing') {
      if (conn) hostSend(conn, { t: 'toast', msg: '游戏尚未开始' });
      return;
    }
    // 严格校验：必须为正整数，且落在当前可猜范围 [range.min, range.max] 内
    // 越界（含空值/0/负数/非数字/超上界）一律拦截：不计历史、不改范围、不切换回合
    var v = parseIntStrict(raw);
    if (!isFinite(v) || v <= 0 || !inGuessRange(v, h.range)) {
      if (conn) hostSend(conn, { t: 'toast', msg: '请填写范围内的数字' });
      else toast('请填写范围内的数字');
      return;
    }
    if (h.turn !== num) {
      if (conn) hostSend(conn, { t: 'toast', msg: '还没轮到你猜' });
      return;
    }
    var p = findPlayer(num);
    if (!p) return;

    p.guesses.push(v);
    var hit = (v === S.bomb);
    var hint = hit ? 'boom' : (v < S.bomb ? 'low' : 'high');
    h.history.push({ num: num, name: p.name, value: v, hint: hint });

    if (hit) {
      h.winner = { num: num, name: p.name, value: v };
      h.phase = 'over';
    } else {
      // 猜错后收缩范围：把已猜错的数字排除出范围——猜小→下界=v+1；猜大→上界=v-1
      if (v < S.bomb) h.range.min = Math.min(h.range.max, Math.max(h.range.min, v + 1));
      else h.range.max = Math.max(h.range.min, Math.min(h.range.max, v - 1));
      h.turn = nextOnlineNum(num);
    }
    hostBroadcast();
  }
  function hostStart() {
    var h = S.host;
    if (!h) return;
    var cfg = h.config;
    var digits, value;
    if (cfg.mode === 'fixed') {
      var raw = digitsOnly(cfg.value);
      if (!raw || raw.length > 6) { toast('请输入 1~6 位正整数作为炸弹'); return; }
      value = parseInt(raw, 10);
      if (!isFinite(value) || value < 1) { toast('请输入 1~6 位正整数作为炸弹'); return; }
      digits = String(value).length;
    } else {
      digits = Math.min(6, Math.max(1, parseInt(cfg.digits, 10) || 2));
      var lo = 1;
      var hi = pow10(digits) - 1;
      value = lo + Math.floor(Math.random() * (hi - lo + 1));
    }
    S.bomb = value;
    h.digits = digits;
    h.range = { min: 1, max: pow10(digits) - 1 };
    h.players.forEach(function (p) { p.guesses = []; });
    h.history = [];
    h.winner = null;
    h.tada = null;              // 新一局：清空上一局的惩罚会话（惩罚开关与模式保留）
    if (S.wheelTimer) { clearTimeout(S.wheelTimer); S.wheelTimer = null; }
    S.wheelPrevAngle = 0; S.wheelPrevTarget = -1; // 新一局：清空转盘会话
    h.penaltySkips = 0; h.penaltyDrink = false; h.penaltyDone = false; // 新一局炸弹，换题次数重新给 3 次
    S.tadaDeck = null;
    h.phase = 'playing';

  function hostBackLobby() {

    S.wheelPrevAngle = 0; S.wheelPrevTarget = -1; // 返回大厅：清空转盘会话
    h.penaltySkips = 0; h.penaltyDrink = false; h.penaltyDone = false;
    S.tadaDeck = null;
    h.history = [];
    h.players.forEach(function (p) { p.guesses = []; });
    closeModal();
    hostBroadcast();
  }

  /* ---------------- 渲染 ---------------- */
  function findMe(s) {
    for (var i = 0; i < s.players.length; i++) if (s.players[i].num === S.myNum) return s.players[i];
    return null;
  }
  function playerByNum(s, num) {
    for (var i = 0; i < s.players.length; i++) if (s.players[i].num === num) return s.players[i];
    return null;
  }

  function render() {
    var s = S.pub;
    if (!s) return;

    var focusId = null, selS = null, selE = null;
    var ae = document.activeElement;
    if (ae && ae.id) {
      focusId = ae.id;
      try { selS = ae.selectionStart; selE = ae.selectionEnd; } catch (e) {}
    }
    ['input-guess', 'input-bomb'].forEach(function (id) {
      var el = $(id);
      if (el) S.inputCache[id] = el.value;
    });
    if (S.lastPhase !== s.phase) S.inputCache['input-guess'] = '';

    $('room-code').textContent = s.code;
    $('my-badge').textContent = '#' + (S.myNum || '-');
    var me = findMe(s);
    $('my-name-view').textContent = me ? me.name : '我';

    renderPlayers(s);
    $('main').innerHTML = mainHtml(s);

    if (focusId) {
      var el2 = $(focusId);
      if (el2 && !el2.disabled) {
        el2.focus();
        try { if (selS != null) el2.setSelectionRange(selS, selE); } catch (e) {}
      }
    }

    if (s.phase === 'over' && S.lastPhase !== 'over') openModal(overModalHtml(s));
    if (s.phase === 'over' && !$('modal').classList.contains('hidden')) $('modal-card').innerHTML = overModalHtml(s); // 惩罚完成后刷新弹层，别留旧的接受/跳过按钮
    if (s.phase !== 'over' && !$('modal').classList.contains('hidden')) closeModal();

    renderTada(s);

    S.lastPhase = s.phase;
  }

  function renderPlayers(s) {
    var html = s.players.map(function (p) {
      var active = (s.phase === 'playing' && s.turn === p.num);
      var cls = 'pcard' + (p.online ? '' : ' offline') + (active ? ' active' : '');
      var chips = p.guesses.length
        ? p.guesses.map(function (g) { return '<span class="chip">' + g + '</span>'; }).join('')
        : '<span class="chip empty">暂无</span>';
      var you = (p.num === S.myNum) ? '<i class="you">我</i>' : '';
      var flag = active ? '<span class="turnflag">猜数中</span>' : '';
      return '<div class="' + cls + '">' +
        '<div class="pname"><b>#' + p.num + '</b><span class="nm">' + esc(p.name) + '</span>' + you + flag + '</div>' +
        '<div class="chips">' + chips + '</div>' +

  function mainHtml(s) {

  function lobbyHtml(s) {

    } else {

           (pen.enabled ? ('已开启 · ' + (penKind === 'wheel' ? '大转盘' : TADA_MODE_LABEL[pen.mode])) : '未开启') + '</p></div>';
    }

  }

  function hostSetupHtml(s) {
    var cfg = S.host.config;
    var pills = [1, 2, 3, 4, 5, 6].map(function (d) {
      var on = (cfg.mode === 'digits' && parseInt(cfg.digits, 10) === d) ? ' on' : '';
      return '<button class="pill' + on + '" data-action="digit" data-v="' + d + '">' + d + ' 位</button>';
    }).join('');

    h += '<button class="seg-btn' + (cfg.mode === 'fixed' ? ' on' : '') + '" data-action="mode" data-v="fixed">指定数字</button>';

      h += '<p class="hint">1~6 位正整数；发牌后玩家轮流猜，猜中即结束。</p>';

    h += penaltyBoxHtml(s);

    h += '</div>';
    return h;
  }

  /* 游戏结束惩罚（真心话大冒险）设置 —— 不是独立卡片，嵌在「设置炸弹」卡片内部：
     · 开关为小巧 toggle（左右滑动）
     · 模式选项用与「1 位 / 2 位 / 3 位」一致的胶囊按钮左右并排（选中橙红渐变、未选深蓝灰）

  function penaltyBoxHtml(s) {
    var p = (S.host && S.host.penalty) || s.penalty || { enabled: true, mode: 'date', kind: 'tada' };

    var h = '<div class="penalty-box">';

           '<div class="switch' + (p.enabled ? ' on' : '') + '" data-action="penalty-toggle" role="switch" aria-checked="' +
           (p.enabled ? 'true' : 'false') + '"></div>' +
         '</div>';
    if (p.enabled) {
      h += '<div class="pills pills-2">' +
             '<button class="pill' + (kind === 'tada' ? ' on' : '') + '" data-action="penalty-kind" data-v="tada">真心话大冒险</button>' +
             '<button class="pill' + (kind === 'wheel' ? ' on' : '') + '" data-action="penalty-kind" data-v="wheel">大转盘</button>' +
           '</div>';
      h += '<div class="pills pills-2">' +
             '<button class="pill' + (p.mode === 'date' ? ' on' : '') + '" data-action="penalty-mode" data-v="date">男女朋友版</button>' +
             '<button class="pill' + (p.mode === 'couple' ? ' on' : '') + '" data-action="penalty-mode" data-v="couple">情侣升级版</button>' +
           '</div>';
      if (kind === 'tada') {

      var a0 = i * step - Math.PI / 2, a1 = a0 + step;

      ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length]; ctx.fill();
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(a0 + step / 2);
      ctx.fillStyle = "#fff"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
      var label = list[i].t.replace(/\s/g, ""); label = label.length > 4 ? label.slice(0, 4) : label;
      ctx.fillText(label, r - 18, 0); ctx.restore();

    ctx.beginPath(); ctx.arc(cx, cy, 58, 0, Math.PI * 2); ctx.fillStyle = "#0a0d16"; ctx.fill();
  }
  // 转盘转完撒花：满屏彩纸飘约 2.8 秒，不挡点击，播完自动清理
  function launchWheelConfetti() {
    var old = document.querySelector('.wheel-confetti');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var cv = document.createElement('canvas');
    cv.className = 'wheel-confetti';
    cv.width = window.innerWidth; cv.height = window.innerHeight;
    document.body.appendChild(cv);
    var ctx = cv.getContext('2d');
    var W = cv.width, H = cv.height, N = 120, parts = [], i;
    for (i = 0; i < N; i++) {
      parts.push({
        x: Math.random() * W, y: -20 - Math.random() * 220,
        w: 6 + Math.random() * 7, h: 8 + Math.random() * 8,
        vy: 2.2 + Math.random() * 3.2, vx: -1.2 + Math.random() * 2.4,
        rot: Math.random() * Math.PI * 2, vr: -0.12 + Math.random() * 0.24,
        color: WHEEL_COLORS[Math.floor(Math.random() * WHEEL_COLORS.length)],
        round: Math.random() < 0.35
      });
    }
    var t0 = Date.now(), DUR = 2800;
    (function frame() {
      var el = Date.now() - t0;
      if (el >= DUR || !cv.parentNode) {
        if (cv.parentNode) cv.parentNode.removeChild(cv);
        return;
      }
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = el > DUR - 800 ? Math.max(0, (DUR - el) / 800) : 1;
      for (i = 0; i < N; i++) {
        var p = parts[i];
        p.y += p.vy; p.x += p.vx + Math.sin((el / 300) + i) * 0.6; p.rot += p.vr;
        if (p.y > H + 30) { p.y = -20; p.x = Math.random() * W; }
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
        else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);

      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(frame);

  function renderWheel(s) {
    var layer = $('tada-layer');
    if (!layer) return;

      if (!layer.classList.contains('hidden')) { layer.classList.add('hidden'); layer.innerHTML = ''; }
      return;
    }
    var target = (t.wheelTarget != null ? t.wheelTarget : -1);
    var angle = t.wheelAngle || 0;
    var done = !!t.wheelDone;
    var spun = target >= 0;
    var actor = isTadaActor(s);
    var list = wheelList(t.wheelVer || (s.penalty && s.penalty.mode) || 'date');
    // 转完、结果一出来就撒一次花（就地更新和重建两条路都会经过这里，每格只撒一次）
    if (target === -1) S.wheelConfettiFor = -1;
    else if (spun && done && S.wheelConfettiFor !== target) { S.wheelConfettiFor = target; launchWheelConfetti(); }
    var detail = '';
    if (spun && target >= 0 && target < list.length) detail = list[target].d;
    else if (t.cat) detail = t.cat;
    // 目标/角度没变且画布还在：只就地更新结果与按钮状态，不重建画布，
    // 转盘动画不会被中途打断（wheelDone 广播走这条路）。
    var existing = $('wheelCanvas');
    if (existing && S.wheelPrevTarget === target && S.wheelPrevAngle === angle) {
      var resEl = layer.querySelector('.wheel-result');
      if (resEl) {
        if (spun && done && t.text) { resEl.className = 'wheel-result'; resEl.innerHTML = '<b>' + esc(t.text) + '</b>：' + esc(detail); }
        else { resEl.className = 'wheel-result wheel-result-empty'; resEl.innerHTML = ''; }
      }
      var btns = layer.querySelectorAll('.wheel-btns .btn');
      // 转一下平时可点、转完变黑底（和另外两个一样），再按由点击事件弹字提示，不用 disabled 拦
      if (btns[0]) { btns[0].className = (!spun && actor) ? 'btn primary' : 'btn'; btns[0].disabled = false; }
      if (btns[1]) btns[1].disabled = (!actor || !spun || !done);
      if (btns[2]) btns[2].disabled = (!actor || !spun || !done);
      return;
    }
    var resultHtml = (spun && done && t.text)
      ? '<div class="wheel-result"><b>' + esc(t.text) + '</b>：' + esc(detail) + '</div>'
      : '<div class="wheel-result wheel-result-empty"></div>';
    var spinCls = (!spun && actor) ? 'btn primary' : 'btn';
    var endDis = (!actor || !spun || !done) ? ' disabled' : '';
    layer.innerHTML = '<div class="wheel-wrap">' +
      '<div class="wheel-box"><div class="wheel-pointer"></div>' +
      '<canvas id="wheelCanvas" class="wheel-canvas" width="640" height="640"></canvas></div>' +
      resultHtml +
      '<div class="wheel-btns">' +
      '<button class="' + spinCls + '" data-action="wheel-spin">🎡 转一下</button>' +
      '<button class="btn" data-action="wheel-drink"' + endDis + '>🍺 不做，喝半杯</button>' +
      '<button class="btn" data-action="wheel-done"' + endDis + '>✅ 做完了</button>' +
      '</div></div>';
    layer.classList.remove('hidden');

    var prev = (typeof S.wheelPrevAngle === 'number' ? S.wheelPrevAngle : 0);
    if (spun && done) {
      // 结果已出（迟加入/重渲染）：直接摆到最终角度，不再重播 3.2s 动画
      cv.style.transition = 'none';

      cv.style.transition = 'none';
      cv.style.transform = 'rotate(' + angle + 'deg)';
    }
    S.wheelPrevAngle = angle;
    S.wheelPrevTarget = target;
  }

  /* ---------- 房主：联机真心话大冒险（权威抽题 + P2P 同步） ---------- */
  function hostPenaltySet(patch) {
    var h = S.host;
    if (!h) return;
    if (typeof patch.enabled === 'boolean') h.penalty.enabled = patch.enabled;
    if (patch.mode === 'date' || patch.mode === 'couple') h.penalty.mode = patch.mode;
    if (patch.kind === 'tada' || patch.kind === 'wheel') h.penalty.kind = patch.kind;
    if (!h.penalty.enabled) h.tada = null;   // 关闭开关时收起惩罚层
    hostBroadcast();
  }
  function hostTadaOpen() {
    var h = S.host;
    if (!h) return;
    if (h.penaltyDone) { toast('本轮惩罚已完成'); return; }
    if ((h.penalty.kind || 'tada') === 'wheel') {
      // 大转盘：不开 tada Deck，只开转盘会话，抽签由 hostWheelSpin 做
      h.tada = { open: true, kind: 'wheel', text: '', cat: '', drawn: 0, by: (h.winner ? h.winner.num : 0), skips: 0, drink: false, wheelTarget: -1, wheelAngle: 0, wheelDone: false, wheelVer: h.penalty.mode || 'date' };
      hostBroadcast();
      return;
    }
    if (!tadaReady()) { toast(TADA_EMPTY); return; }
    S.tadaDeck = tadaNewDeck(h.penalty.mode);
    // 关了重开也不清零：用本局已累计的换题次数恢复
    h.tada = { open: true, kind: null, text: '', cat: '', drawn: 0, by: (h.winner ? h.winner.num : 0), skips: h.penaltySkips || 0, drink: !!h.penaltyDrink };
    hostBroadcast();
  }
  function hostWheelSpin(requesterNum) {
    var h = S.host;
    if (!h || !h.tada || !h.tada.open || h.tada.kind !== 'wheel') return;
    var by = h.tada.by || (h.winner ? h.winner.num : 0);
    if (requesterNum && by && requesterNum !== by) return; // 只有被罚的人能转
    if (h.tada.wheelTarget != null && h.tada.wheelTarget >= 0) return; // 本轮只转一次
    var list = wheelList(h.tada.wheelVer || h.penalty.mode);
    var target = Math.floor(Math.random() * list.length);
    var seg = 360 / list.length;
    var base = 360 * 5 + (360 - (target * seg + seg / 2));
    h.tada.wheelAngle = (h.tada.wheelAngle || 0) + base;
    h.tada.wheelTarget = target;
    h.tada.wheelDone = false;
    h.tada.text = list[target].t;
    h.tada.cat = list[target].d;
    h.tada.drawn = (h.tada.drawn || 0) + 1;
    hostBroadcast();
    if (S.wheelTimer) clearTimeout(S.wheelTimer);
    S.wheelTimer = setTimeout(function () {
      S.wheelTimer = null;
      if (!S.host || !S.host.tada || !S.host.tada.open || S.host.tada.kind !== 'wheel') return;
      if (S.host.tada.wheelTarget !== target) return;
      S.host.tada.wheelDone = true;
      hostBroadcast();
    }, 3300);
  }
  function hostWheelDrink(requesterNum) {
    var h = S.host;
    if (!h || !h.tada || !h.tada.open || h.tada.kind !== 'wheel') return;
    var by = h.tada.by || (h.winner ? h.winner.num : 0);
    if (requesterNum && by && requesterNum !== by) return;
    if (!h.tada.wheelDone) return; // 结果没出来前不能点
    if (S.wheelTimer) { clearTimeout(S.wheelTimer); S.wheelTimer = null; }
    h.tada = null;
    h.penaltyDone = true;
    h.penaltyDrink = true; // 喝半杯这次同时记 penaltyDrink
    S.wheelPrevAngle = 0; S.wheelPrevTarget = -1;
    hostBroadcast();
    toast('已记半杯');
  }
  function hostWheelDone(requesterNum) {
    var h = S.host;
    if (!h || !h.tada || !h.tada.open || h.tada.kind !== 'wheel') return;
    var by = h.tada.by || (h.winner ? h.winner.num : 0);
    if (requesterNum && by && requesterNum !== by) return;
    if (!h.tada.wheelDone) return; // 结果没出来前不能点
    if (S.wheelTimer) { clearTimeout(S.wheelTimer); S.wheelTimer = null; }
    h.tada = null;
    h.penaltyDone = true;
    S.wheelPrevAngle = 0; S.wheelPrevTarget = -1;
    hostBroadcast();
  }
  function hostTadaPick(kind) {
    var h = S.host;
    if (!h || !h.tada || !h.tada.open) return;
    if (h.tada.kind === 'wheel') return; // 大转盘会话不走抽题
    if (h.tada.drink) return; // 已换满 3 次锁定罚喝，不再抽新题
    if (!tadaReady()) { toast(TADA_EMPTY); return; }
    if (!S.tadaDeck) S.tadaDeck = tadaNewDeck(h.penalty.mode);
    var k = (kind === 'dare') ? 'dare' : 'truth';
    var q = S.tadaDeck.draw(k);
    h.tada.kind = k;
    h.tada.text = q.text;
    h.tada.cat = q.cat || '';
    h.tada.drawn = (h.tada.drawn || 0) + 1;
    hostBroadcast();
  }
  function hostTadaNext(requesterNum) {
    var h = S.host;
    if (!h || !h.tada || !h.tada.open || !h.tada.kind) return;
    if (h.tada.kind === 'wheel') return; // 大转盘会话不走换题
    if (h.tada.drink) return; // 已锁定罚喝，不再抽题
    // 权限：只有被罚的人能换题（房主本人不是被罚者时也拦）
    var by = h.tada.by || (h.winner ? h.winner.num : 0);
    if (requesterNum && by && requesterNum !== by) return;
    // 当前这道正是牵手题且被换掉：记一次跳过，后面低概率复出（本页面会话内有效）
    if (h.tada.kind === 'dare' && S.tadaDeck && S.tadaDeck.noteSkipped) S.tadaDeck.noteSkipped(h.tada.text);
    // 真心话和大冒险合计最多换 3 次，不分种类；换种类也不重置
    if ((h.tada.skips || 0) >= 3) { h.tada.drink = true; h.penaltyDrink = true; hostBroadcast(); return; }
    h.tada.skips = (h.tada.skips || 0) + 1;
    h.penaltySkips = h.tada.skips;
    hostTadaPick(h.tada.kind);
    // 第 3 次换完即锁定：当前这道题就是最后一道，再点换题就罚喝，提前没有下一题
    if ((h.tada.skips || 0) >= 3) { h.tada.drink = true; h.penaltyDrink = true; hostBroadcast(); }
  }
  /* v2.3：跳过惩罚不再直接开新局（旧逻辑调 hostStart 会把换题次数清零重给 3 次，
     等于绕过“换满 3 次先喝一杯”）。现在跳过=先喝一杯：记 penaltyDone，不开新局，
     换题次数不清零；想再玩由房主另点“再来一局”，那时才是新一局、重新给 3 次。 */
  function hostSkipPenalty() {
    var h = S.host;
    if (!h) return;
    if (h.penaltyDone) return; // 本局惩罚已完成，不再重复记
    if (S.wheelTimer) { clearTimeout(S.wheelTimer); S.wheelTimer = null; }
    S.wheelPrevAngle = 0; S.wheelPrevTarget = -1;
    h.tada = null;
    h.penaltyDone = true; // 跳过也算本局惩罚已处理，惩罚层不再重开
    h.penaltyDrink = true; // 跳过先喝（tada 一杯 / 大转盘半杯）
    closeModal();
    hostBroadcast();
    toast(((h.penalty.kind || 'tada') === 'wheel' ? '已记半杯' : '已记一杯') + '，点“再来一局”开新局');
  }
  function hostTadaClose(requesterNum) {
    var h = S.host;
    if (!h) return;
    if (h.tada && h.tada.kind === 'wheel') return; // 大转盘用 hostWheelDrink/Done 关
    // 权限：只有被罚的人能点完成/认罚，别人不能帮她关掉
    if (h.tada) {
      var by = h.tada.by || (h.winner ? h.winner.num : 0);
      if (requesterNum && by && requesterNum !== by) return;
    }
    h.tada = null;
    h.penaltyDone = true; // 本局惩罚已完成，之后再点接受惩罚也不会重开
    hostBroadcast();
  }
  function clientTada(act, kind) {
    if (S.hostConn && S.hostConn.open) S.hostConn.send({ t: 'tada', act: act, kind: kind || null });
    else toast('连接已断开');
  }

  /* ---------------- 页面切换 ---------------- */
  function enterRoom() {
    $('screen-home').classList.remove('active');
    $('screen-room').classList.add('active');
    S.lastPhase = null;
  }
  function goHome() {
    closeModal();
    cleanup();
    $('screen-room').classList.remove('active');
    $('screen-tada').classList.remove('active');
    $('screen-home').classList.add('active');
    resetSolo();
    var layer = $('tada-layer');
    if (layer) { layer.classList.add('hidden'); layer.innerHTML = ''; }
    if (S.wheelTimer) { clearTimeout(S.wheelTimer); S.wheelTimer = null; }
    S.wheelPrevAngle = 0; S.wheelPrevTarget = -1;
    tip('');
  }
  function cleanup() {
    try { if (S.hostConn) S.hostConn.close(); } catch (e) {}
    try { if (S.peer) S.peer.destroy(); } catch (e) {}
    S.peer = null; S.hostConn = null; S.conns = {};
    S.role = null; S.host = null; S.pub = null; S.bomb = null;
    S.tadaDeck = null;
    S.myNum = 0; S.code = ''; S.lastPhase = null; S.busy = false;
    S.inputCache = { 'input-guess': '', 'input-bomb': '' };
  }

  /* ---------------- 房主：创建房间 ---------------- */
  function doCreate() {
    if (S.busy) return;
    if (typeof window.Peer !== 'function') { tip('PeerJS 尚未加载完成，请稍候或检查网络'); return; }
    S.myName = clampName($('input-name').value) || '房主';
    S.busy = true;
    tip('正在创建房间…');
    var attempt = 0;
    (function tryOnce() {
      attempt++;
      var code = rand6();
      var p;
      try { p = new Peer('sdb-' + code, { debug: 1 }); }
      catch (err) { S.busy = false; tip('初始化失败：' + err.message); return; }
      var opened = false;
      p.on('open', function () {
        opened = true;
        S.busy = false;
        S.role = 'host';
        S.peer = p;
        S.code = code;
        S.myNum = 1;
        S.host = newHostState(code);
        S.host.players.push({ num: 1, name: S.myName, online: true, guesses: [] });
        bindHost(p);
        enterRoom();
        hostBroadcast();
        tip('');
        toast('房间已创建：' + code);
      });
      p.on('error', function (err) {
        if (opened) { console.warn('[host peer error]', err); return; }
        try { p.destroy(); } catch (e) {}
        var t = err && err.type;
        if (t === 'unavailable-id' && attempt < 8) { setTimeout(tryOnce, 80); return; }
        S.busy = false;
        tip('创建房间失败（' + (t || '未知错误') + '），请重试');
      });
    })();
  }

  /* ---------------- 客户端：加入房间 ---------------- */
  function doJoin() {
    if (S.busy) return;
    if (typeof window.Peer !== 'function') { tip('PeerJS 尚未加载完成，请稍候或检查网络'); return; }
    var code = digitsOnly($('input-code').value);
    if (code.length !== 3) { tip('请输入 3 位房号'); return; }
    S.myName = clampName($('input-name').value) || '玩家';
    S.busy = true;
    tip('正在连接房主…');

    var p;
    try { p = new Peer(null, { debug: 1 }); }
    catch (err) { S.busy = false; tip('初始化失败：' + err.message); return; }
    S.peer = p;

    var settled = false;
    var timer = setTimeout(function () {
      if (settled) return;
      settled = true;
      S.busy = false;
      try { p.destroy(); } catch (e) {}
      tip('连接超时：房间不存在或网络不通');
    }, 20000);

    function finish() { settled = true; clearTimeout(timer); S.busy = false; }

    p.on('open', function () {
      var conn;
      try { conn = p.connect('sdb-' + code, { reliable: true, serialization: 'json' }); }
      catch (e) { finish(); tip('连接失败：' + e.message); return; }
      S.hostConn = conn;

      conn.on('open', function () {
        conn.send({ t: 'join', name: S.myName });
      });
      conn.on('data', function (data) {
        if (!data || typeof data !== 'object') return;
        if (data.t === 'welcome') {
          finish();
          S.role = 'client';
          S.code = data.code || code;
          S.myNum = data.num;
          enterRoom();
          tip('');
          toast('已加入房间，你是 #' + data.num + ' 号');
        } else if (data.t === 'state') {
          S.pub = data.state;
          render();
        } else if (data.t === 'toast') {
          toast(data.msg);
        }
      });
      conn.on('close', function () {
        if (!settled) { finish(); try { p.destroy(); } catch (e) {} tip('加入失败：房间不存在或房主已离开'); }
        else {
          openModal('<div class="boom">⚡</div><h2>连接已断开</h2>' +
            '<p class="muted">与房主的连接已中断，房间可能已关闭。</p>' +
            '<div class="btn-row"><button class="btn primary" data-action="home">返回首页</button></div>');
        }
      });
      conn.on('error', function (e) { console.warn('[conn error]', e); });
    });

    p.on('error', function (err) {
      var t = err && err.type;
      if (t === 'peer-unavailable') {
        if (!settled) { finish(); try { p.destroy(); } catch (e) {} tip('房间不存在，请检查 3 位房号'); }
        return;
      }
      console.warn('[client peer error]', err);
    });
  }

  /* ---------------- 操作 ---------------- */
  function doGuess() {
    var s = S.pub;
    if (!s || s.phase !== 'playing') return;
    var el = $('input-guess');
    if (!el) return;
    // 本地先做范围拦截（空值、0、负数、非数字、超上界均视为超范围）
    var val = parseIntStrict(el.value);
    if (!isFinite(val) || val <= 0 || !inGuessRange(val, s.range)) { toast('请填写范围内的数字'); return; }
    if (s.turn !== S.myNum) { toast('还没轮到你猜'); return; }
    S.inputCache['input-guess'] = '';
    el.value = '';
    if (S.role === 'host') hostGuess(1, val, null);
    else if (S.hostConn && S.hostConn.open) S.hostConn.send({ t: 'guess', value: val });
    else toast('连接已断开');
  }

  function copyText(text, okMsg) {
    var done = function () { toast(okMsg + '：' + text); };
    var bad = function () { toast('复制失败，请手动记录：' + text); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done)['catch'](function () { legacyCopy(text, done, bad); });
    } else {
      legacyCopy(text, done, bad);
    }
  }
  function legacyCopy(text, ok, bad) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var r = document.execCommand('copy');
      document.body.removeChild(ta);
      if (r) ok(); else bad();
    } catch (e) { bad(); }
  }
  function shareLink() {
    var base = location.href.split('#')[0].split('?')[0];
    return base + '?room=' + S.code;
  }

  function doLeave() {
    if (S.role === 'host') {
      if (!window.confirm('你是房主，退出后房间将关闭，其他玩家会被断开。确定退出吗？')) return;
    }
    goHome();
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-action]') : null;
    if (!el) return;
    var act = el.getAttribute('data-action');
    if (act === 'create') doCreate();
    else if (act === 'join') doJoin();
    else if (act === 'copy-code') copyText(S.code, '房间号已复制');
    else if (act === 'copy-link') copyText(shareLink(), '邀请链接已复制');
    else if (act === 'leave') doLeave();
    else if (act === 'home') goHome();
    else if (act === 'mode') { if (S.host) { S.host.config.mode = (el.getAttribute('data-v') === 'fixed' ? 'fixed' : 'digits'); render(); } }
    else if (act === 'digit') { if (S.host) { S.host.config.digits = parseInt(el.getAttribute('data-v'), 10) || 2; render(); } }
    else if (act === 'start' || act === 'again') hostStart();
    else if (act === 'lobby') hostBackLobby();
    else if (act === 'guess') doGuess();
    else if (act === 'close-modal') { if (S.role !== 'host') closeModal(); }
    /* --- 单独玩 · 真心话大冒险 --- */
    else if (act === 'solo-tada') soloEnter();
    else if (act === 'solo-exit') soloExit();
    else if (act === 'solo-mode') soloChooseMode(el.getAttribute('data-v'));
    else if (act === 'solo-pick') soloPick(el.getAttribute('data-v'));
    else if (act === 'solo-next') soloNext();
    /* --- 游戏结束惩罚（房主可操作） --- */
    else if (act === 'penalty-toggle') { if (S.host) hostPenaltySet({ enabled: !S.host.penalty.enabled }); }
    else if (act === 'penalty-mode') { if (S.host) hostPenaltySet({ mode: el.getAttribute('data-v') }); }
    else if (act === 'penalty-kind') { if (S.host) hostPenaltySet({ kind: el.getAttribute('data-v') }); }
    else if (act === 'wheel-spin') {
      var ws = S.pub || (S.host ? hostPublic() : null);
      if (ws && !isTadaActor(ws)) { toast('只有被罚的人能转'); return; }
      if (ws && ws.tada && ws.tada.wheelTarget != null && ws.tada.wheelTarget >= 0) { toast('请先接收惩罚'); return; }
      if (S.role === 'host') hostWheelSpin(S.myNum); else clientTada('wheel-spin');
    }
    else if (act === 'wheel-drink') {
      var wd = S.pub || (S.host ? hostPublic() : null);
      if (wd && !isTadaActor(wd)) { toast('只有被罚的人能点'); return; }
      if (S.role === 'host') hostWheelDrink(S.myNum); else clientTada('wheel-drink');
    }
    else if (act === 'wheel-done') {
      var wn = S.pub || (S.host ? hostPublic() : null);
      if (wn && !isTadaActor(wn)) { toast('只有被罚的人能点'); return; }
      if (S.role === 'host') hostWheelDone(S.myNum); else clientTada('wheel-done');
    }
    /* --- 页内真心话大冒险层（联机） --- */
    else if (act === 'accept-penalty') { if (S.role === 'host') hostTadaOpen(); else clientTada('open'); }
    else if (act === 'skip-penalty') { if (S.role === 'host') hostSkipPenalty(); else { var sp = S.pub || (S.host ? hostPublic() : null); var sk = (sp && sp.penalty && sp.penalty.kind) || 'tada'; toast(sk === 'wheel' ? '跳过要房主记半杯' : '跳过要房主记一杯'); } }
    else if (act === 'tada-pick') {
      if (S.role === 'host') hostTadaPick(el.getAttribute('data-v'));
      else clientTada('pick', el.getAttribute('data-v'));
    }
    else if (act === 'tada-next') {
      var st = S.pub || (S.host ? hostPublic() : null);
      if (st && !isTadaActor(st)) { toast('只有被罚的人能换题'); return; }
      if (S.role === 'host') hostTadaNext(S.myNum); else clientTada('next');
    }
    else if (act === 'tada-done') {
      var st2 = S.pub || (S.host ? hostPublic() : null);
      if (st2 && !isTadaActor(st2)) { toast('只有被罚的人能完成惩罚'); return; }
      if (S.role === 'host') hostTadaClose(S.myNum); else clientTada('close');
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.id) return;
    // 猜测输入原样缓存（仅限长，渲染时经 esc 转义），避免被静默改写（如 "-5"→"5"）
    if (t.id === 'input-guess') S.inputCache['input-guess'] = String(t.value == null ? '' : t.value).slice(0, 12);
    if (t.id === 'input-bomb') {
      S.inputCache['input-bomb'] = digitsOnly(t.value);
      if (S.host) S.host.config.value = S.inputCache['input-bomb'];
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var t = e.target;
    if (!t || !t.id) return;
    if (t.id === 'input-code') { e.preventDefault(); doJoin(); }
    else if (t.id === 'input-guess') { e.preventDefault(); doGuess(); }
  });

  window.addEventListener('beforeunload', function () {
    try { if (S.hostConn) S.hostConn.close(); } catch (e) {}
    try { if (S.peer) S.peer.destroy(); } catch (e) {}
  });

  /* ---------------- 启动 ---------------- */
  function initApp() {
    var m = location.search.match(/[?&]room=(\d{3})/);
    if (m) {
      var el = $('input-code');
      if (el) el.value = m[1];
      tip('已自动填入房间号，点击「加入」即可进入房间');
    }
  }
  function bootstrap() {
    if (typeof window.Peer === 'function') { initApp(); return; }
    var tries = 0;
    var t = setInterval(function () {
      if (typeof window.Peer === 'function') { clearInterval(t); initApp(); }
      else if (++tries > 120) {
        clearInterval(t);
        tip('PeerJS 加载失败：请检查网络，或将 peerjs.min.js 放到 vendor 目录');
      }
    }, 100);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootstrap);
  else bootstrap();
})();
</script>
</body>
</html>
